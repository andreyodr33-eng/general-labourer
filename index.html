<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAUL</title>

<link rel="manifest" href="manifest.json">
 <link rel="icon" href="icon-192.png" type="image/png">
<meta name="theme-color" content="#222222">
 
<style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  background:
    linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
    linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
    linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
  background-size: 40px 40px;
  background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
}

.flip-card {
  width: 320px;
  height: 180px;
  perspective: 1000px;
}

.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.8s;
}

@media (hover: hover) and (pointer: fine) {
  .flip-card:hover .flip-card-inner {
    transform: rotateY(180deg);
  }
}

.flip-card-inner.flipped {
  transform: rotateY(180deg);
}

.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 12px;
  padding: 15px;
  box-sizing: border-box;
  background: #222;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

 .flip-card-front *,
 .flip-card-back * {
      margin: 0;
      padding: 0;
      line-height: 1.85;
}

.flip-card-back {
  transform: rotateY(180deg);
  text-align: center;
}

a {
  color: red;
  text-decoration: none;
  margin-top: 6px;
}
  /*Адаптация под экран телефона*/
      @media (max-width: 480px) {
      #consultation-form {
      padding: 15px;
      max-width: 90%;
    }
  }
</style>
</head>

<body>

<div class="flip-card">
  <div class="flip-card-inner" id="flipCard">

    
    <div class="flip-card-front">
      <h3>GUINNESS</h3>
      <p>PAUL - Loadmaster</p>
      <p>Company STL</p>
      <a href="tel:+3530874893815">📞 +353 087 489 3815</a>
     
    </div>
     

    
    <div class="flip-card-back">
      <h2>MONOBANK-VISA</h2>
      <p>5375 4199 1406 3076</p>
      <p>UA093220010000026208340026552</p>
      <p>
        
      <a href="javascript:void(0)" onclick="shareCard()">📤 share</a>
        
      </p>
   
    </div>

  </div>
</div>

<script>

const flipCard = document.getElementById('flipCard');
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

if (isTouchDevice) {
  flipCard.addEventListener('click', () => {
    flipCard.classList.toggle('flipped');
  });
}

// Web Share API
function shareCard() {
  if (navigator.share) {
    navigator.share({
      title: "Andrii - Web Developer",
      text: "Моя цифровая визитка:",
      url: window.location.href
    });
  } else {
    alert("Sharing is not supported bu this browser");
  }
}
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/vault/service-worker.js")
    .then(() => console.log("Service Worker registered"));
}
</script>

</body>
</html>
